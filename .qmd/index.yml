global_context: Tokenmill is a local-first Rust workspace for reducing and evaluating GitHub Copilot request context. Current source and documentation take precedence over archived plans and dated research.
collections:
  tokenmill:
    path: .
    pattern: "**/*.md"
    ignore:
      - "**/target/**"
      - "**/graphify-out/**"
    context:
      /: Current Tokenmill documentation, domain glossary, and agent guidance.
      /docs: Architecture and ACP replay documentation.
  tokenmill-wayfinder:
    path: .wayfinder
    pattern: "**/*.md"
    context:
      /: Tokenmill planning records and redacted research evidence.
      /archive: Historical V1 specifications, completed tickets, and decisions; verify against current source.
      /research: Dated research and verification evidence; support claims apply only to the recorded tests.
models:
  embed: hf:ggml-org/embeddinggemma-300M-GGUF/embeddinggemma-300M-Q8_0.gguf
  generate: hf:tobil/qmd-query-expansion-1.7B-gguf/qmd-query-expansion-1.7B-q4_k_m.gguf
  rerank: hf:ggml-org/Qwen3-Reranker-0.6B-Q8_0-GGUF/qwen3-reranker-0.6b-q8_0.gguf
